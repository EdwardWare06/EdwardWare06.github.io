<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightning Background</title>
<meta name="robots" content="noindex">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04070f;
  }
  canvas#scene {
    display: block;
    width: 100vw;
    height: 100vh;
    /* The host window is click-through; this is belt and braces. */
    pointer-events: none;
  }
  #fallback {
    display: none;
    position: fixed;
    left: 24px;
    bottom: 24px;
    font: 13px/1.5 Consolas, monospace;
    color: #9fd0ff;
    background: rgba(4, 7, 15, 0.85);
    border-left: 2px solid #4ea8ff;
    padding: 10px 14px;
    max-width: 60ch;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <pre id="fallback"></pre>
  <script type="module" src="./main.js"></script>
  <script type="module" src="/assets/js/demos/lightning-adapter.js"></script>
</body>
</html>
